<div class="container">
  <h2>Brown International Academy Bike Bus</h2>

  <div id="calendars">
    <div class="calendar-container">
      <h4>Federal (East Side) Calendar</h4>
      <div id="east_calendar"></div>
    </div>
    <div class="calendar-container">
      <h4>Sloan's (West Side) Calendar</h4>
      <div id="west_calendar"></div>
    </div>
  </div>
</div>

<script>
 document.addEventListener('DOMContentLoaded', function() {

   function fetchICalEvents(url, callback) {
     fetch(url)
       .then(response => response.text())
       .then(data => {
         const jcalData = ICAL.parse(data);
         const comp = new ICAL.Component(jcalData);
         const vevents = comp.getAllSubcomponents("vevent");

         const events = vevents.map(vevent => {
           const event = new ICAL.Event(vevent);
           return {
             title: event.summary,
             start: event.startDate.toJSDate(),
             end: event.endDate.toJSDate()
           };
         });

         callback(events);
       })
       .catch(error => console.error('Error fetching iCal file:', error));
   }

   // Initialize FullCalendar for East Calendar
   var eastCalendarEl = document.getElementById('east_calendar');
   var eastCalendar = new FullCalendar.Calendar(eastCalendarEl, {
     initialView: 'dayGridMonth',
     events: function(fetchInfo, successCallback, failureCallback) {
       fetchICalEvents('https://user.fm/calendar/v1-cf4239a7a8c9cd03ad53b0d0a5e1b370/Brown%20International%20Academy%20Bike%20Bus%3A%20Federal.ics', successCallback);
     }
   });
   eastCalendar.render();

   // Initialize FullCalendar for West Calendar
   var westCalendarEl = document.getElementById('west_calendar');
   var westCalendar = new FullCalendar.Calendar(westCalendarEl, {
     initialView: 'dayGridMonth',
     events: function(fetchInfo, successCallback, failureCallback) {
       fetchICalEvents('https://user.fm/calendar/v1-204ebab22d4ddebacfa56db55c3caa31/Brown%20International%20Academy%20Bike%20Bus%3A%20Sloans.ics', successCallback);
     }
   });
   westCalendar.render();
 });
</script>

<h4>Federal Live Location</h4>
<div id="map" style="height: 400px;"></div>
<button id="toggleShare">Toggle Location Share</button>

<script>
  // Initialize the map centered on Denver (80211 zip code)
  let map = L.map('map').setView([39.7587, -105.0232], 13);

  // Add OpenStreetMap tile layer
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  // Define the coordinates for the starting point and destination
  var startPoint = [39.75348369119278, -105.02575538655891];  // 2485 N Federal Blvd, Denver, CO 80211
  var endPoint = [39.75369091395738, -105.03318297551003];    // 2550 Lowell Blvd, Denver, CO 80211

 // Add routing from start to end point using Leaflet Routing Machine
 L.Routing.control({
   waypoints: [
     L.latLng(startPoint),  // Start point: 2485 N Federal Blvd
     L.latLng(endPoint)     // End point: 2550 Lowell Blvd
   ],
   routeWhileDragging: true
 }).addTo(map);

document.getElementById('toggleShare').addEventListener('click', toggleLocationShare);
</script>
